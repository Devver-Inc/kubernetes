# Valeurs fournies par la pipeline (cluster-k8s-deployment,
# ansible/playbooks/06-argocd-bootstrap.yml) en paramètres Helm de
# l'Application racine — rien n'est écrit par cluster dans ce repo.
cluster:
  org: ""          # requis — ex: vr27
  env: ""          # requis — prod | staging | dev
  domain: ""       # requis — <org>-<env>.devver.app
  ingressIP: ""    # IP MetalLB de Traefik (informatif, DNS / Traefik frontal plus tard)

# Partage NFS DÉDIÉ au cluster (Terraform nfs_server / nfs_share).
nfs:
  server: ""
  share: ""

git:
  kubernetes:
    repoURL: git@github.com:Devver-Inc/kubernetes.git
    revision: main        # branche pendant les tests, tag en prod
  clientDeployment:
    repoURL: git@github.com:Devver-Inc/argocd-client-deployment.git
    revision: main

vaultAddr: https://vault.devver.app

# Clé publique (non secrète) avec laquelle le git-gateway se connecte aux
# deploy-agents : chaque agent n'accepte qu'elle sur son port 22.
gitGateway:
  # Clé publique de upstreamKey (Vault git-gateway/upstreamPublicKey), passée
  # par la pipeline (playbook 06) : chaque deploy-agent n'accepte qu'elle.
  publicKey: ""
  # Version figée : une nouvelle version du git-gateway passe par une PR.
  image: ghcr.io/devver-inc/git-gateway:0.1.0
  # Vide = le backend du cluster (défaut du chart git-gateway).
  backendUrl: ""
# Publication d'un déploiement local sur <route>.<id>.share.<domaine>
# (chart opentunnel). Déployé sur les clusters dont cluster.env est dans envs.
opentunnel:
  envs: [dev]
  # Build de master du fork Devver-Inc/opentunnel (workflow ghcr-image.yml).
  image: ghcr.io/devver-inc/opentunnel-server:sha-5a08404
  # Création de tunnel depuis l'extérieur (POST /api/tunnel) : jwt = réservée
  # aux utilisateurs Logto (JWT validé par le plugin Traefik "jwt").
  publicCreate: jwt
acmeEmail: info@devver.app

# Cible external-dns (CNAME) des Ingress. Vide tant que le Traefik frontal et
# le DNS Cloudflare ne sont pas en place (étape ultérieure).
dnsTarget: ""

# Composants activables (désactivés tant que leur configuration n'est pas prête)
components:
  externalDns: false   # routes / DNS Cloudflare : étape ultérieure
  kasten: false        # sauvegardes : configuration détaillée plus tard

# Images dont la source a changé
images:
  minio:
    repository: pgsty/minio            # minio/minio retiré de Docker Hub
    tag: RELEASE.2026-08-04T00-00-00Z

# Versions figées des charts / sources externes
versions:
  argocd: 10.10.3          # chart argo-cd (Argo CD v3.5.5)
  externalSecrets: 2.11.0
  certManager: v1.21.2
  csiDriverNfs: v4.9.0
  # externalSnapshotter : retiré — RKE2 >= 1.36 installe déjà les CRD et le
  # contrôleur de snapshots (rke2-snapshot-controller*). À réévaluer avec
  # Kasten (VolumeSnapshotClass / version des CRD requise).
  externalDns: 1.23.0
  kasten: 8.5.12
