# Une Application par projet client du cluster :
# argocd-client-deployment/<org>-<env>/<org client>/<projet>/values.yaml
# (écrit par le backend, GITHUB_PATH_PREFIX=<org>-<env>), rendu par
# helm-chart-deployment-template avec les secrets depuis Vault (ESO).
# path[0] = cluster, path[1] = org client, path[2] = projet.
{{- $id := include "root.clusterId" . }}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: client-deployment
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  generators:
    - git:
        repoURL: {{ .Values.git.clientDeployment.repoURL }}
        revision: {{ .Values.git.clientDeployment.revision }}
        directories:
          - path: {{ $id }}/*/*
  template:
    metadata:
      name: {{ `'{{path[1]}}-{{path[2]}}'` }}
    spec:
      project: clients
      destination:
        server: https://kubernetes.default.svc
      sources:
        - repoURL: {{ .Values.git.kubernetes.repoURL }}
          targetRevision: {{ .Values.git.kubernetes.revision }}
          path: helm-chart-deployment-template
          helm:
            valueFiles:
              - {{ `'$values/{{path}}/values.yaml'` }}
            parameters:
              - name: cluster.org
                value: {{ .Values.cluster.org | quote }}
              - name: cluster.env
                value: {{ .Values.cluster.env | quote }}
              - name: organization.domain
                value: {{ include "root.domain" . | quote }}
              - name: secrets.enabled
                value: "true"
              - name: imagePullSecret.mode
                value: eso
              - name: dnsTarget
                value: {{ .Values.dnsTarget | quote }}
              - name: persistence.app.storageClass
                value: {{ include "root.storageClass" . | quote }}
              - name: persistence.root.storageClass
                value: {{ include "root.storageClass" . | quote }}
        - repoURL: {{ .Values.git.clientDeployment.repoURL }}
          targetRevision: {{ .Values.git.clientDeployment.revision }}
          ref: values
      ignoreDifferences:
        - kind: PersistentVolumeClaim
          jsonPointers:
            - /spec/volumeName
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - RespectIgnoreDifferences=true
