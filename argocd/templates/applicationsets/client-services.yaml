# Un service de projet client par <cluster>/p-<id>/services/<service>/values.yaml.
# path[1] = p-<projectId>, path.basename = le service.
{{- $id := include "root.clusterId" . }}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: client-services
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  generators:
    - git:
        repoURL: {{ .Values.git.clientDeployment.repoURL }}
        revision: {{ .Values.git.clientDeployment.revision }}
        files:
          - path: {{ $id }}/p-*/services/*/values.yaml
  template:
    metadata:
      name: {{ `'{{path[1]}}-{{path.basename}}'` }}
    spec:
      project: clients
      destination:
        server: https://kubernetes.default.svc
        namespace: {{ `'{{path[1]}}'` }}
      sources:
        - repoURL: {{ .Values.git.kubernetes.repoURL }}
          targetRevision: {{ .Values.git.kubernetes.revision }}
          path: helm-chart-service-template
          helm:
            valueFiles:
              - {{ `'$values/{{path}}/values.yaml'` }}
            parameters:
              - name: cluster.org
                value: {{ .Values.cluster.org | quote }}
              - name: cluster.env
                value: {{ .Values.cluster.env | quote }}
              - name: persistence.storageClass
                value: {{ include "root.storageClass" . | quote }}
        - repoURL: {{ .Values.git.clientDeployment.repoURL }}
          targetRevision: {{ .Values.git.clientDeployment.revision }}
          ref: values
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - PrunePropagationPolicy=foreground
