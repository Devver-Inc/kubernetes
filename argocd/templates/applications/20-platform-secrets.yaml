{{ include "root.appMeta" (dict "name" "platform-secrets" "wave" "-3") }}
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets-system
  source:
    repoURL: {{ .Values.git.kubernetes.repoURL }}
    targetRevision: {{ .Values.git.kubernetes.revision }}
    path: platform-secrets
    helm:
      valuesObject:
        cluster:
          org: {{ .Values.cluster.org }}
          env: {{ .Values.cluster.env }}
        vault:
          server: {{ .Values.vaultAddr }}
  {{- include "root.syncPolicy" (dict "opts" (list)) | nindent 2 }}
