{{ include "root.appMeta" (dict "name" "snapshot-controller" "wave" "-3") }}
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  source:
    repoURL: https://github.com/kubernetes-csi/external-snapshotter
    targetRevision: {{ .Values.versions.externalSnapshotter }}
    path: deploy/kubernetes/snapshot-controller
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/spec/containers/0/resources
  {{- include "root.syncPolicy" (dict "opts" (list "ServerSideApply=true")) | nindent 2 }}
