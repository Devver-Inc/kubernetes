{{ include "root.appMeta" (dict "name" "external-secrets" "wave" "-4") }}
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets-system
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: {{ .Values.versions.externalSecrets }}
    helm:
      releaseName: external-secrets
      valuesObject:
        installCRDs: true
  {{- include "root.syncPolicy" (dict "opts" (list "ServerSideApply=true")) | nindent 2 }}
