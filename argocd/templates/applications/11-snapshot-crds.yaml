{{ include "root.appMeta" (dict "name" "snapshot-crds" "wave" "-4") }}
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  source:
    repoURL: https://github.com/kubernetes-csi/external-snapshotter
    targetRevision: {{ .Values.versions.externalSnapshotter }}
    path: client/config/crd
  {{- include "root.syncPolicy" (dict "prune" false "opts" (list "Replace=true" "ServerSideApply=true")) | nindent 2 }}
