apiVersion: v1
kind: ServiceAccount
metadata:
  name: git-gateway
  namespace: devver-git-gateway
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-gateway
  namespace: devver-git-gateway
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: git-gateway
  template:
    metadata:
      labels:
        app: git-gateway
    spec:
      serviceAccountName: git-gateway
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: git-gateway
        image: {{ .Values.image }}
        ports:
        - name: ssh
          containerPort: 2222
        env:
        - name: DEVVER_BACKEND_URL
          value: {{ .Values.backendUrl | quote }}
        - name: DEVVER_UPSTREAM_TEMPLATE
          value: {{ .Values.upstreamTemplate | quote }}
        - name: DEVVER_UPSTREAM_KEY_FILE
          value: /etc/git-gateway/upstreamKey
        - name: DEVVER_GATEWAY_SECRET
          valueFrom:
            secretKeyRef: { name: git-gateway, key: gatewaySecret }
        - name: SSHPIPERD_SERVER_KEY_DATA
          valueFrom:
            secretKeyRef: { name: git-gateway, key: hostKey }
        volumeMounts:
        - name: keys
          mountPath: /etc/git-gateway
          readOnly: true
        readinessProbe:
          tcpSocket:
            port: ssh
        resources:
          requests:
            memory: "32Mi"
            cpu: "20m"
          limits:
            memory: "128Mi"
            cpu: "500m"
      volumes:
      - name: keys
        secret:
          secretName: git-gateway
          items:
          - key: upstreamKey
            path: upstreamKey
          defaultMode: 0400
---
# Port 22 public de git.<domaine> (redirection TCP depuis le Traefik / reverse proxy frontal).
apiVersion: v1
kind: Service
metadata:
  name: git-gateway
  namespace: devver-git-gateway
spec:
  type: LoadBalancer
  selector:
    app: git-gateway
  ports:
  - name: ssh
    port: 22
    targetPort: ssh
