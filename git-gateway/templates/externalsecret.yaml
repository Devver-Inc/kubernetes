{{- $prefix := required "vault.prefix est requis (<org>/<env>)" .Values.vault.prefix }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: git-gateway
  namespace: devver-git-gateway
spec:
  refreshInterval: {{ .Values.vault.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform
  target:
    name: git-gateway
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        annotations:
          devver.app/vault-check: {{ `{{ range $k, $v := . }}{{ if or (eq (trim $v) "") (eq (upper (trim $v)) "CHANGEME") }}{{ fail (printf "cle %s vide ou CHANGEME dans Vault" $k) }}{{ end }}{{ end }}ok` | squote }}
  dataFrom:
    - extract:
        key: {{ $prefix }}/git-gateway
