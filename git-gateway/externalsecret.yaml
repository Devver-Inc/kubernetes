# Vault devver_K8s/git-gateway : { gatewaySecret, hostKey (base64), upstreamKey }.
# La clé publique de upstreamKey va dans devver_K8s/shared/git-gateway { publicKey } (lue par les agents).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: git-gateway
  namespace: devver-git-gateway
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault
  namespace: devver-git-gateway
spec:
  provider:
    vault:
      server: "https://vault.devver.app"
      path: "devver_K8s"
      version: v2
      auth:
        kubernetes:
          mountPath: "devver_k8s_prod"
          role: "git-gateway"
          serviceAccountRef:
            name: git-gateway
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: git-gateway
  namespace: devver-git-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: git-gateway
  data:
    - secretKey: gatewaySecret
      remoteRef: { key: git-gateway, property: gatewaySecret }
    - secretKey: hostKey
      remoteRef: { key: git-gateway, property: hostKey }
    - secretKey: upstreamKey
      remoteRef: { key: git-gateway, property: upstreamKey }
