# Middleware appliqué à toutes les routes HTTPS du Traefik de RKE2 (nouveaux
# clusters) : référencé par le HelmChartConfig rke2-traefik déposé par
# cluster-k8s-deployment (ansible/playbooks/03-cluster-init.yml) sous le nom
# kube-system-security-headers@kubernetescrd. Déployé par ArgoCD (wave 0).
# Le cluster de prod actuel utilise ../security-headers-middleware.yaml (ns traefik).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: kube-system
spec:
  headers:
    # HSTS
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    stsPreload: true
    forceSTSHeader: true
    # Clickjacking / MIME sniffing
    frameDeny: true
    contentTypeNosniff: true
    browserXssFilter: true
    referrerPolicy: "strict-origin-when-cross-origin"
    permissionsPolicy: "geolocation=(), microphone=(), camera=(), payment=()"
    contentSecurityPolicy: >-
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net;
      style-src 'self' 'unsafe-inline';
      img-src 'self' data: https:;
      font-src 'self' data:;
      connect-src 'self' https: wss:;
      frame-ancestors 'self';
      object-src 'none';
      base-uri 'self';
    # Ne pas divulguer la version de Traefik
    customResponseHeaders:
      X-Powered-By: ""
      Server: ""
