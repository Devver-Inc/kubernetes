additionalArguments:
  - "--providers.kubernetesingress=true"
  - "--providers.kubernetesingress.ingressclass=traefik"
  - "--providers.kubernetescrd=true"
  - "--entrypoints.websecure.address=:8443"
  - "--certificatesresolvers.cloudflare.acme.email=info@devver.app"
  - "--certificatesresolvers.cloudflare.acme.storage=/data/acme.json"
  - "--certificatesresolvers.cloudflare.acme.dnschallenge=true"
  - "--certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare"

env:
  - name: CF_DNS_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-dns
        key: CF_DNS_API_TOKEN

ports:
  websecure:
    port: 8443        # port interne Traefik
    exposedPort: 443  # port externe pour les clients
    expose:
      default: true

persistence:
  enabled: true
  name: data
  path: /data
  size: 1Gi
  accessMode: ReadWriteOnce
  storageClass: longhorn

podSecurityContext:
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: null 
  runAsNonRoot: true

# aucune capability
securityContext: {}

extraInitContainers:
  - name: fix-acme-perms
    image: busybox
    securityContext:
      runAsUser: 0   # ROOT UNIQUEMENT POUR FIXER LES DROITS
    command:
      - sh
      - -c
      - |
        mkdir -p /data
        touch /data/acme.json
        chown -R 65532:65532 /data
        chmod 600 /data/acme.json
    volumeMounts:
      - mountPath: /data
        name: data

ingressClass:
  enabled: true
  isDefaultClass: true
  name: traefik
