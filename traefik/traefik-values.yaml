additionalArguments:
  - "--providers.kubernetesingress=true"
  - "--providers.kubernetescrd=false"

  - "--entrypoints.web.address=:80"
  - "--entrypoints.websecure.address=:443"

  - "--certificatesresolvers.cloudflare.acme.email=info@devver.app"
  - "--certificatesresolvers.cloudflare.acme.storage=/data/acme.json"
  - "--certificatesresolvers.cloudflare.acme.dnschallenge=true"
  - "--certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare"

  - "--log.level=INFO"

env:
  - name: CF_DNS_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-dns
        key: CF_DNS_API_TOKEN

persistence:
  enabled: true
  name: data
  accessMode: ReadWriteOnce
  size: 1Gi
  path: /data
  storageClass: longhorn

securityContext:
  runAsUser: 65532
  runAsGroup: 65532
  runAsNonRoot: true

deployment:
  initContainers:
    - name: init-acme
      image: busybox
      securityContext:
        runAsUser: 0
      command:
        - sh
        - -c
        - |
          chown -R 65532:65532 /data
          touch /data/acme.json
          chown 65532:65532 /data/acme.json
          chmod 600 /data/acme.json
      volumeMounts:
        - mountPath: /data
          name: data


ports:
  web:
    port: 80
  websecure:
    port: 443


ingressClass:
  enabled: true
  isDefaultClass: true
  name: traefik
