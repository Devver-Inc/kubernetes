defaultSettings:
  defaultReplicaCount: 2
  replicaSoftAntiAffinity: true
  staleReplicaTimeout: 30

  #  Empêche l'auto-création de disques ailleurs
  createDefaultDiskLabeledNodes: false

  #  Chemin UNIQUE du disque Longhorn
  defaultDataPath: /mnt/longhorn

  # Sécurité
  allowNodeDrainWithLastHealthyReplica: false
  disableSchedulingOnCordonedNode: true

ui:
  enabled: false

ingress:
  enabled: false

manager:
  enabled: true

#  Longhorn UNIQUEMENT sur les workers
longhornManager:
  nodeSelector:
    node-role.kubernetes.io/worker: ""

longhornDriver:
  nodeSelector:
    node-role.kubernetes.io/worker: ""

longhornUI:
  nodeSelector:
    node-role.kubernetes.io/worker: ""

longhornAdmissionWebhook:
  nodeSelector:
    node-role.kubernetes.io/worker: ""

longhornConversionWebhook:
  nodeSelector:
    node-role.kubernetes.io/worker: ""

longhornRecoveryBackend:
  nodeSelector:
    node-role.kubernetes.io/worker: ""

# ❌ AUCUN disque auto
defaultDiskConfig:
  allowScheduling: false

nodeSelector: {}
tolerations: []
