# Configuration de l'organisation et du projet
organization:
  name: "orgtest"  # Nom de l'organisation
  domain: "devver.app"  # Domaine principal

project:
  name: "projtest"  # Nom du projet
  displayName: "projtest"  # Nom d'affichage

# Configuration du conteneur (OS Linux complet ou application)
container:
  image: "debian:bookworm"  # Image du conteneur (OS Linux ou application)
  port: 8080  # Port exposé par le conteneur
  # Type de déploiement: "linux" pour un OS, "app" pour une application
  type: "linux"
  # Commande pour garder le conteneur actif (important pour un OS)
  # Pour un OS: "sleep infinity" ou "tail -f /dev/null"
  # Pour une app: spécifier la commande de démarrage de l'application
  command: ["sleep"]
  args: ["infinity"]
  
# Configuration des ressources
resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

# Configuration de la persistance
persistence:
  enabled: true
  size: "10Gi"
  mountPath: "/data"  # Persiste tout le système de fichiers du conteneur

# Configuration du nombre de replicas
replicaCount: 1

# Configuration des ports
ports:
  http: 80
  https: 443

# Labels et sélecteurs additionnels
labels: {}
annotations: {}
