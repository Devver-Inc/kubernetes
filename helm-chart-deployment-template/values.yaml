organization:
  id: ""
  name: ""
  domain: "devver.app"

project:
  id: ""
  name: ""

agentImage: "ghcr.io/devver-inc/deploy-agent:v0.2.0"

imagePullSecrets:
  - name: ghcr-secret

container:
  env:
    DEVVER_PROJECT_ID: ""
    DEVVER_PREVIEW_DOMAIN: "preview.devver.app"

vault:
  server: "https://vault.devver.app"
  kvMount: "devver_K8s"
  authMount: "devver_k8s_prod"
  role: "deploy-agent-eso"

network:
  traefikNamespace: "traefik"
  backendNamespace: "devver-backend-service"
  gitGatewayNamespace: "devver-git-gateway"

resources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "2Gi"
    cpu: "2000m"

persistence:
  enabled: true
  app:
    size: "10Gi"
    mountPath: "/app"
    storageClass: nfs-devver-prod
  root:
    size: "5Gi"
    mountPath: "/root"
    storageClass: nfs-devver-prod

labels: {}
annotations: {}
