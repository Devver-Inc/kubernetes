# Configuration de l'organisation et du projet
organization:
  name: "orgtest"  # Nom de l'organisation
  domain: "k8s.devver.app"  # Domaine principal

project:
  name: "projtest"  # Nom du projet
  displayName: "projtest"  # Nom d'affichage

# Configuration du conteneur (OS Linux complet ou application)
container:
  image: "nginx:latest"  # Image du conteneur (OS Linux ou application)
  port: 80  # Port exposé par le conteneur
  # Type de déploiement: "linux" pour un OS, "app" pour une application
  type: "app"
  # Commande pour démarrer l'application (laisser vide pour nginx)
  # Pour nginx: laisser vide (image par défaut)
  # Pour Ubuntu/Debian: ["sleep", "infinity"]
  # Pour Apache: ["/usr/sbin/apache2ctl", "-D", "FOREGROUND"]
  command: []
  args: []
  
# Configuration des ressources
resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

# Configuration de la persistance
persistence:
  enabled: true
  size: "10Gi"
  mountPath: "/data"  # Persiste tout le système de fichiers du conteneur

# Configuration du nombre de replicas
replicaCount: 1

# Configuration des ports
ports:
  http: 80
  https: 443

# Labels et sélecteurs additionnels
labels: {}
annotations: {}
