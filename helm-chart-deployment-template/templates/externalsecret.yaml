{{- $ns := include "app-template.namespace" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deploy-agent-eso
  namespace: {{ $ns }}
  labels:
    {{- include "app-template.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
# Partagé avec le chart Mongo du même namespace.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault
  namespace: {{ $ns }}
  labels:
    {{- include "app-template.labels" . | nindent 4 }}
spec:
  provider:
    vault:
      server: {{ .Values.vault.server | quote }}
      path: {{ .Values.vault.kvMount | quote }}
      version: v2
      auth:
        kubernetes:
          mountPath: {{ .Values.vault.authMount | quote }}
          role: {{ .Values.vault.role | quote }}
          serviceAccountRef:
            name: deploy-agent-eso
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: deploy-agent-env
  namespace: {{ $ns }}
  labels:
    {{- include "app-template.labels" . | nindent 4 }}
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: deploy-agent-env
  dataFrom:
    - extract:
        key: projects/{{ $ns }}/agent
  data:
    - secretKey: DEVVER_GIT_GATEWAY_PUBLIC_KEY
      remoteRef:
        key: shared/git-gateway
        property: publicKey
