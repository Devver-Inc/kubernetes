apiVersion: v1
kind: Service
metadata:
  name: {{ include "app-template.fullname" . }}
  namespace: {{ include "app-template.namespace" . }}
  labels:
    {{- include "app-template.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.ports.http }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if .Values.project.id }}
    - name: api
      port: 8080
      targetPort: api
    - name: ssh
      port: 22
      targetPort: ssh
    {{- end }}
  selector:
    {{- include "app-template.selectorLabels" . | nindent 4 }}
