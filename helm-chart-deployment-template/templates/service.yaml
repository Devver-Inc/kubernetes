apiVersion: v1
kind: Service
metadata:
  name: {{ include "app-template.fullname" . }}
  namespace: {{ include "app-template.namespace" . }}
  labels:
    {{- include "app-template.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "app-template.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: api
      port: 8080
      targetPort: api
    - name: ssh
      port: 22
      targetPort: ssh
