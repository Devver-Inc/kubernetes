apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app-template.fullname" . }}
  namespace: {{ include "app-template.namespace" . }}
  labels:
    {{- include "app-template.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "app-template.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app-template.selectorLabels" . | nindent 8 }}
      {{- with .Values.annotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      # Le code des utilisateurs tourne dans ce pod : aucun token Kubernetes monté.
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: deploy-agent
        image: {{ .Values.agentImage }}
        ports:
        - name: http
          containerPort: 80
        - name: api
          containerPort: 8080
        - name: ssh
          containerPort: 22
        envFrom:
        - secretRef:
            name: deploy-agent-env
        {{- with .Values.container.env }}
        env:
        {{- range $key, $value := . }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        {{- end }}
        readinessProbe:
          httpGet:
            path: /health
            port: api
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: api
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 4
        resources:
          requests:
            memory: {{ .Values.resources.requests.memory }}
            cpu: {{ .Values.resources.requests.cpu }}
          limits:
            memory: {{ .Values.resources.limits.memory }}
            cpu: {{ .Values.resources.limits.cpu }}
        {{- if .Values.persistence.enabled }}
        volumeMounts:
        - name: app
          mountPath: {{ .Values.persistence.app.mountPath }}
        - name: root
          mountPath: {{ .Values.persistence.root.mountPath }}
        {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
      - name: app
        persistentVolumeClaim:
          claimName: {{ include "app-template.pvcNameApp" . }}
      - name: root
        persistentVolumeClaim:
          claimName: {{ include "app-template.pvcNameRoot" . }}
      {{- end }}
