apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "app-template.fullname" . }}-ingress
  namespace: {{ include "app-template.namespace" . }}
  labels:
    {{- include "app-template.labels" . | nindent 4 }}
  annotations:
    external-dns.alpha.kubernetes.io/target: "reverse-proxy.vrhometech.fr"
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare

spec:
  ingressClassName: traefik
  tls:
  - hosts:
      - {{ include "app-template.hostname" . }}
    secretName: {{ include "app-template.fullname" . }}-tls

  rules:
  - host: {{ include "app-template.hostname" . }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ include "app-template.fullname" . }}
            port:
              number: {{ .Values.ports.http }}
