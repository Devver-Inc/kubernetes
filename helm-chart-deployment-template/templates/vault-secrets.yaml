{{- if .Values.secrets.enabled }}
# ServiceAccount présenté à Vault (auth k8s-<org>-<env>, role eso-tenant) :
# la policy Vault restreint la lecture à clients/<ce namespace>/*.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-reader
  namespace: {{ include "app-template.namespace" . }}
  labels:
    {{- include "app-template.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  namespace: {{ include "app-template.namespace" . }}
  labels:
    {{- include "app-template.labels" . | nindent 4 }}
spec:
  provider:
    vault:
      server: {{ .Values.secrets.vault.server | quote }}
      path: {{ .Values.secrets.vault.mount | quote }}
      version: v2
      auth:
        kubernetes:
          mountPath: {{ include "app-template.vaultAuthMount" . | quote }}
          role: {{ .Values.secrets.vault.role | quote }}
          serviceAccountRef:
            name: vault-reader
---
# Toutes les clés de clients/<namespace>/app (écrites par le backend) →
# Secret <fullname>-env, injecté en envFrom dans le conteneur. Pas de Secret
# (donc pas de pod) si une valeur est vide ou à CHANGEME (vaultCheck).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "app-template.fullname" . }}-env
  namespace: {{ include "app-template.namespace" . }}
  labels:
    {{- include "app-template.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: {{ include "app-template.fullname" . }}-env
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        annotations:
          {{- include "app-template.vaultCheck" . | nindent 10 }}
  dataFrom:
    - extract:
        key: {{ include "app-template.vaultPath" . }}/app
{{- end }}
