apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: preview-wildcard
  namespace: traefik
spec:
  secretName: preview-wildcard-tls
  dnsNames:
    - "*.preview.devver.app"
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-cloudflare
---
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: traefik
spec:
  defaultCertificate:
    secretName: preview-wildcard-tls
---
# Nécessite la CRD DNSEndpoint (source `crd` d'external-dns) :
#   kubectl get crd dnsendpoints.externaldns.k8s.io
# Sinon, créer le CNAME à la main dans Cloudflare (non proxifié).
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: preview-wildcard
  namespace: traefik
  annotations:
    external-dns.alpha.kubernetes.io/target: reverse-proxy.vrhometech.fr
spec:
  endpoints:
    - dnsName: "*.preview.devver.app"
      recordType: CNAME
      targets:
        - reverse-proxy.vrhometech.fr
