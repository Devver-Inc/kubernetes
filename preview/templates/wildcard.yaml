apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: preview-wildcard
  namespace: {{ .Values.traefikNamespace }}
spec:
  secretName: preview-wildcard-tls
  dnsNames:
    - "*.preview.{{ .Values.domain }}"
  issuerRef:
    kind: ClusterIssuer
    name: {{ .Values.issuer }}
---
# Les IngressRoute de preview (tls: {}) utilisent ce certificat, choisi par SNI.
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: {{ .Values.traefikNamespace }}
spec:
  defaultCertificate:
    secretName: preview-wildcard-tls
{{- with .Values.dnsTarget }}
---
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: preview-wildcard
  namespace: {{ $.Values.traefikNamespace }}
  annotations:
    external-dns.alpha.kubernetes.io/target: {{ . | quote }}
spec:
  endpoints:
    - dnsName: "*.preview.{{ $.Values.domain }}"
      recordType: CNAME
      targets:
        - {{ . | quote }}
{{- end }}
