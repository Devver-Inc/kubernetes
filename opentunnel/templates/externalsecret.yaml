{{- $prefix := required "vault.prefix est requis (<org>/<env>)" .Values.vault.prefix }}
# Secrets du serveur et de MySQL depuis Vault (ClusterSecretStore vault-platform :
# namespace labellisé devver.app/secrets-tier=platform par platform-secrets).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opentunnel
  namespace: devver-opentunnel
spec:
  refreshInterval: {{ .Values.vault.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform
  target:
    name: opentunnel
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        annotations:
          devver.app/vault-check: {{ `{{ range $k, $v := . }}{{ if or (eq (trim $v) "") (eq (upper (trim $v)) "CHANGEME") }}{{ fail (printf "cle %s vide ou CHANGEME dans Vault" $k) }}{{ end }}{{ end }}ok` | squote }}
  dataFrom:
    - extract:
        key: {{ $prefix }}/opentunnel
  data:
    - secretKey: cloudflare_api_token
      remoteRef:
        key: {{ $prefix }}/{{ .Values.cloudflare.path }}
        property: {{ .Values.cloudflare.property }}
