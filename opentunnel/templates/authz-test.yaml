{{- if .Values.forwardAuth.testStub }}
# TEST UNIQUEMENT (forwardAuth.testStub) : faux /api/v1/tunnels/authorize, à la
# place du backend, pour tester la chaîne Traefik -> ForwardAuth -> serveur
# avant que le backend ait la vraie route. 200 + X-Devver-User si
# Authorization vaut "Bearer <test_authz_token>" (Vault, clé de opentunnel),
# 401 sinon. Ne jamais l'activer hors du cluster de dev.
apiVersion: v1
kind: ConfigMap
metadata:
  name: opentunnel-authz-test
  namespace: devver-opentunnel
data:
  # Image nginx : /etc/nginx/templates/*.template passe par envsubst au
  # démarrage (seules les variables d'environnement définies sont remplacées).
  default.conf.template: |
    server {
      listen 8080;
      location = /healthz { return 200 "ok\n"; }
      location / {
        if ($http_authorization = "Bearer ${TEST_AUTHZ_TOKEN}") {
          add_header X-Devver-User "test-user" always;
          return 200;
        }
        return 401;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opentunnel-authz-test
  namespace: devver-opentunnel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opentunnel-authz-test
  template:
    metadata:
      labels:
        app: opentunnel-authz-test
      annotations:
        checksum/config: {{ .Values.forwardAuth | toJson | sha256sum | trunc 16 }}
    spec:
      automountServiceAccountToken: false
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: TEST_AUTHZ_TOKEN
          valueFrom:
            secretKeyRef: { name: opentunnel, key: test_authz_token }
        volumeMounts:
        - name: templates
          mountPath: /etc/nginx/templates
        readinessProbe:
          httpGet: { path: /healthz, port: http }
        resources:
          requests: { memory: "16Mi", cpu: "10m" }
          limits: { memory: "64Mi", cpu: "200m" }
      volumes:
      - name: templates
        configMap:
          name: opentunnel-authz-test
---
apiVersion: v1
kind: Service
metadata:
  name: opentunnel-authz-test
  namespace: devver-opentunnel
spec:
  selector:
    app: opentunnel-authz-test
  ports:
  - name: http
    port: 8080
    targetPort: http
{{- end }}
