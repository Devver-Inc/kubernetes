apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: myapp-secrets
  namespace: myapp-test
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-myapp-test
    kind: ClusterSecretStore
  target:
    name: myapp-secrets
  data:
    - secretKey: db-password
      remoteRef:
        key: test/myapp/database
        property: password