apiVersion: apps/v1
kind: Deployment
metadata:
  name: logto
  namespace: devver-logto
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logto
  template:
    metadata:
      labels:
        app: logto
    spec:
      containers:
        - name: logto
          image: svhd/logto:latest  
          command: ["sh", "-c"]
          args:
            - |
              export DB_URL="postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@logto-postgres-svc:5432/logto"
              npm run cli db seed -- --swe && npm start
          env:
            - name: TRUST_PROXY_HEADER
              value: "1"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: logto-postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: logto-postgres-secret
                  key: POSTGRES_PASSWORD
            - name: ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: logto-config
                  key: ENDPOINT
            - name: ADMIN_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: logto-config
                  key: ADMIN_ENDPOINT
          ports:
            - containerPort: 3001
            - containerPort: 3002
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z logto-postgres-svc 5432; do echo waiting for postgres; sleep 2; done;']
