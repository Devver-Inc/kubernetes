apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth-logto-ingress
  namespace: devver-logto
  annotations:
    external-dns.alpha.kubernetes.io/target: reverse-proxy.vrhometech.fr
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
spec:
  ingressClassName: traefik
  rules:
  - host: auth.k8s.devver.app
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: logto-svc
            port:
              number: 3001
  tls:
  - hosts:
      - auth.k8s.devver.app
    secretName: auth-tls