apiVersion: apps/v1
kind: Deployment
metadata:
  name: logto-postgres
  namespace: devver-logto
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logto-postgres
  template:
    metadata:
      labels:
        app: logto-postgres
    spec:
      # Le NAS n'accorde à un utilisateur non-root que les dossiers dont il est
      # PROPRIÉTAIRE (pas "other", même en 777), et la racine du volume doit
      # rester à root (sinon même son nouveau propriétaire ne peut plus y
      # accéder — constaté sur vr27-dev). On crée donc un SOUS-DOSSIER de
      # données attribué à l'utilisateur de l'image (root est autorisé : pas de
      # squash). Non récursif ; sans effet si le dossier existe déjà.
      initContainers:
        - name: volume-ownership
          image: busybox:1.36
          command:
            - sh
            - -c
            - >-
              mkdir -p /var/lib/postgresql/data/pgdata &&
              chown 70:70 /var/lib/postgresql/data/pgdata &&
              chmod 700 /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: logto-postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: logto-postgres-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            exec:
              command:
                - sh 
                - -c
                - pg_isready -U postgres
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: logto-postgres-pvc-nfs