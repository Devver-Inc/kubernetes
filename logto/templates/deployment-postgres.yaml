apiVersion: apps/v1
kind: Deployment
metadata:
  name: logto-postgres
  namespace: devver-logto
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logto-postgres
  template:
    metadata:
      labels:
        app: logto-postgres
    spec:
      # Le NAS n'applique que les droits du PROPRIÉTAIRE (pas "other", même en
      # 777) : sur un volume neuf, créé par root, l'utilisateur de l'image ne
      # pourrait pas écrire. On lui attribue d'abord son dossier de données
      # (root est autorisé : pas de squash). Non récursif ; sans effet sur un
      # volume existant déjà au bon propriétaire (prod).
      initContainers:
        - name: volume-ownership
          image: busybox:1.36
          command:
            - sh
            - -c
            - >-
              mkdir -p /var/lib/postgresql/data/pgdata &&
              chown 70:70 /var/lib/postgresql/data /var/lib/postgresql/data/pgdata &&
              chmod 700 /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: logto-postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: logto-postgres-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            exec:
              command:
                - sh 
                - -c
                - pg_isready -U postgres
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: logto-postgres-pvc-nfs