# Le SecretStore "vault" est créé par le chart du deploy-agent dans le même namespace.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "mongo-template.mongoName" . }}-secret
  namespace: {{ include "mongo-template.namespace" . }}
  labels:
    {{- include "mongo-template.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: {{ include "mongo-template.mongoName" . }}-secret
  data:
    - secretKey: MONGO_ROOT_USERNAME
      remoteRef:
        key: projects/{{ include "mongo-template.namespace" . }}/mongo
        property: rootUsername
    - secretKey: MONGO_ROOT_PASSWORD
      remoteRef:
        key: projects/{{ include "mongo-template.namespace" . }}/mongo
        property: rootPassword
