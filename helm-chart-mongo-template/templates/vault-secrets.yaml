{{- if .Values.secrets.enabled }}
# SA / SecretStore propres au chart mongo (Application Argo distincte du chart
# app, qui a les siens : vault-reader / vault) — même role Vault eso-tenant,
# même restriction à clients/<ce namespace>/*.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-reader-mongo
  namespace: {{ include "mongo-template.namespace" . }}
  labels:
    {{- include "mongo-template.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-mongo
  namespace: {{ include "mongo-template.namespace" . }}
  labels:
    {{- include "mongo-template.labels" . | nindent 4 }}
spec:
  provider:
    vault:
      server: {{ .Values.secrets.vault.server | quote }}
      path: {{ .Values.secrets.vault.mount | quote }}
      version: v2
      auth:
        kubernetes:
          mountPath: {{ include "mongo-template.vaultAuthMount" . | quote }}
          role: {{ .Values.secrets.vault.role | quote }}
          serviceAccountRef:
            name: vault-reader-mongo
---
# Même Secret (nom + clés) que templates/secret.yaml en mode historique :
# statefulset / job init / apps clientes n'ont rien à changer.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "mongo-template.mongoName" . }}-secret
  namespace: {{ include "mongo-template.namespace" . }}
  labels:
    {{- include "mongo-template.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: vault-mongo
  target:
    name: {{ include "mongo-template.mongoName" . }}-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        annotations:
          {{- include "mongo-template.vaultCheck" . | nindent 10 }}
      data:
        MONGO_ROOT_USERNAME: {{ `{{ .username }}` | squote }}
        MONGO_ROOT_PASSWORD: {{ `{{ .password }}` | squote }}
        MONGO_CONNECTION_STRING: {{ printf "mongodb://{{ .username }}:{{ .password }}@%s:%d/?tls=true&tlsCAFile=/etc/mongo/tls/ca.crt" (include "mongo-template.mongoName" .) (int .Values.port) | squote }}
  data:
    - secretKey: username
      remoteRef:
        key: {{ include "mongo-template.vaultPath" . }}/mongo
        property: username
    - secretKey: password
      remoteRef:
        key: {{ include "mongo-template.vaultPath" . }}/mongo
        property: password
{{- end }}
