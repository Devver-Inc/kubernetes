apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "mongo-template.mongoName" . }}
  namespace: {{ include "mongo-template.namespace" . }}
  labels:
    {{- include "mongo-template.labels" . | nindent 4 }}
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  serviceName: {{ include "mongo-template.mongoName" . }}-headless
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "mongo-template.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mongo-template.labels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 30

      initContainers:
        - name: fix-keyfile
          image: busybox
          command:
            - sh
            - -c
            - |
              cp /keyfile-secret/mongodb-keyfile /etc/mongo/keyfile
              chmod 400 /etc/mongo/keyfile
              chown 999:999 /etc/mongo/keyfile
          volumeMounts:
            - name: keyfile-secret
              mountPath: /keyfile-secret
              readOnly: true
            - name: keyfile
              mountPath: /etc/mongo
        - name: prepare-tls
          image: busybox
          command:
            - sh
            - -c
            - |
              cat /tls-secret/tls.crt /tls-secret/tls.key > /etc/mongo/tls/combined.pem
              cp /tls-secret/ca.crt /etc/mongo/tls/ca.crt
              chmod 400 /etc/mongo/tls/combined.pem /etc/mongo/tls/ca.crt
              chown 999:999 /etc/mongo/tls/combined.pem /etc/mongo/tls/ca.crt
          volumeMounts:
            - name: tls
              mountPath: /etc/mongo/tls
            - name: tls-secret
              mountPath: /tls-secret
              readOnly: true

      containers:
        - name: mongodb
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--replSet"
            - {{ .Values.replicaSetName | quote }}
            - "--bind_ip_all"
            - "--port"
            - {{ .Values.port | quote }}
            - "--keyFile"
            - "/etc/mongo/keyfile"
            - "--tlsMode"
            - "requireTLS"
            - "--tlsCertificateKeyFile"
            - "/etc/mongo/tls/combined.pem"
            - "--tlsCAFile"
            - "/etc/mongo/tls/ca.crt"
            - "--tlsAllowConnectionsWithoutCertificates"
          ports:
            - name: mongodb
              containerPort: {{ .Values.port }}
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "mongo-template.mongoName" . }}-secret
                  key: MONGO_ROOT_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mongo-template.mongoName" . }}-secret
                  key: MONGO_ROOT_PASSWORD
          livenessProbe:
            exec:
              command:
                - mongosh
                - "--tls"
                - "--tlsCAFile"
                - "/etc/mongo/tls/ca.crt"
                - "--eval"
                - "db.adminCommand('ping')"
                - "--quiet"
            initialDelaySeconds: 120
            periodSeconds: 15
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - mongosh
                - "--tls"
                - "--tlsCAFile"
                - "/etc/mongo/tls/ca.crt"
                - "--eval"
                - "db.adminCommand('ping')"
                - "--quiet"
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: scripts
              mountPath: /scripts
            - name: keyfile
              mountPath: /etc/mongo
            - name: tls
              mountPath: /etc/mongo/tls
              readOnly: true

      volumes:
        - name: scripts
          configMap:
            name: {{ include "mongo-template.mongoName" . }}-init
            defaultMode: 0755
        - name: keyfile-secret
          secret:
            secretName: {{ include "mongo-template.mongoName" . }}-keyfile
            items:
              - key: mongodb-keyfile
                path: mongodb-keyfile
        - name: keyfile
          emptyDir: {}
        - name: tls-secret
          secret:
            secretName: {{ include "mongo-template.mongoName" . }}-tls
        - name: tls
          emptyDir: {}

  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "mongo-template.labels" . | nindent 10 }}
        annotations:
          argocd.argoproj.io/managed-by: "true"
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
