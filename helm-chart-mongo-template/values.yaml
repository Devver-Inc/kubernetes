# Configuration de l'organisation et du projet
# namespace.create: true si ce chart est déployé seul (crée le namespace)
# namespace.create: false si le namespace est déjà créé par le chart app
namespace:
  create: false

organization:
  name: "orgt1"       # Nom de l'organisation
  domain: "devver.app"

project:
  name: "projt1"      # Nom du projet

# Image MongoDB
image:
  repository: "mongo"
  tag: "7.0"
  pullPolicy: IfNotPresent

# Nombre de replicas MongoDB (ReplicaSet)
# 1 = standalone, 3 = HA recommandé
replicaCount: 1

# Nom du ReplicaSet interne MongoDB
replicaSetName: "rs0"

# Cluster cible — chemin Vault kubernetes-cluster/<org>/<env>/clients/<namespace>/mongo
# Injecté par l'ApplicationSet (paramètres Helm), pas par le backend.
cluster:
  org: ""
  env: ""

# Credentials depuis Vault (External Secrets Operator).
# false : comportement historique (auth.* ci-dessous, en clair dans les values).
# true  : le backend écrit kubernetes-cluster/<org>/<env>/clients/<namespace>/mongo
#         (clés username, password — alphanumériques) ; auth.* est ignoré.
secrets:
  enabled: false
  refreshInterval: 15m   # relecture de Vault par ESO (immédiat : annotation force-sync)
  vault:
    server: "https://vault.devver.app"
    mount: "kubernetes-cluster"
    # vide = k8s-<cluster.org>-<cluster.env>
    authMount: ""
    role: "eso-tenant"

# Credentials MongoDB en clair — uniquement si secrets.enabled=false
auth:
  rootUsername: "root"
  rootPassword: "changeme"
  # La connection string peut être reconstruite :
  # mongodb://rootUsername:rootPassword@<fullname>:27017

# Persistent storage
persistence:
  size: "10Gi"
  storageClass: "nfs-devver-prod"

# Ressources
resources:
  requests:
    memory: "512Mi"
    cpu: "100m"
  limits:
    memory: "1Gi"
    cpu: "500m"

# Port MongoDB
port: 27017

# Labels et annotations additionnels
labels: {}
annotations: {}
