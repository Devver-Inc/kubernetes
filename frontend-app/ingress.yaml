apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-app-ingress
  namespace: devver-frontend-app
  annotations:
    external-dns.alpha.kubernetes.io/target: reverse-proxy.vrhometech.fr
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
spec:
  ingressClassName: traefik
  rules:
  - host: app.k8s.devver.app
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-app-svc
            port:
              number: 80
  tls:
  - hosts:
      - app.k8s.devver.app
    secretName: frontend-app-tls