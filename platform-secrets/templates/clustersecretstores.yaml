# vault-platform : secrets de la stack (kubernetes-cluster/<org>/<env>/*, sauf
# clients/), utilisable uniquement depuis un namespace labellisé
# devver.app/secrets-tier=platform.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-platform
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    {{- include "platform-secrets.labels" . | nindent 4 }}
spec:
  conditions:
    - namespaceSelector:
        matchLabels:
          devver.app/secrets-tier: platform
  provider:
    {{- include "platform-secrets.vaultProvider" (dict "ctx" . "role" "eso-platform" "sa" "eso-platform") | nindent 4 }}
---
# vault-ghcr : uniquement kubernetes-cluster/<org>/<env>/ghcr, pour distribuer
# le pull secret GHCR dans les namespaces devver.app/needs-ghcr=true (stack
# ET déploiements clients) sans leur ouvrir le reste de la stack.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-ghcr
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    {{- include "platform-secrets.labels" . | nindent 4 }}
spec:
  conditions:
    - namespaceSelector:
        matchLabels:
          devver.app/needs-ghcr: "true"
  provider:
    {{- include "platform-secrets.vaultProvider" (dict "ctx" . "role" "eso-ghcr" "sa" "eso-ghcr") | nindent 4 }}
