# Pull secret ghcr.io, créé sous le nom ghcr-secret dans chaque namespace
# labellisé devver.app/needs-ghcr=true (remplace Reflector + kube-system/ghcr-secret).
{{- $prefix := include "platform-secrets.prefix" . }}
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: ghcr-secret
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "platform-secrets.labels" . | nindent 4 }}
spec:
  externalSecretName: ghcr-secret
  namespaceSelectors:
    - matchLabels:
        devver.app/needs-ghcr: "true"
  refreshTime: 1m
  externalSecretSpec:
    refreshInterval: {{ .Values.refreshInterval }}
    secretStoreRef:
      kind: ClusterSecretStore
      name: vault-ghcr
    target:
      name: ghcr-secret
      creationPolicy: Owner
      template:
        type: kubernetes.io/dockerconfigjson
        engineVersion: v2
        metadata:
          annotations:
            {{- include "platform-secrets.vaultCheck" . | nindent 12 }}
        data:
          .dockerconfigjson: {{ `{"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}` | squote }}
    data:
      - secretKey: username
        remoteRef:
          key: {{ $prefix }}/ghcr
          property: username
      - secretKey: token
        remoteRef:
          key: {{ $prefix }}/ghcr
          property: token
