# Un ExternalSecret par Secret consommé par la stack : mêmes noms et mêmes
# clés que les anciens Secrets en clair, les Deployments ne changent pas.
# Chacun porte le garde-fou vaultCheck (_helpers.tpl) : pas de Secret — donc
# pas de pod — tant qu'une valeur est vide ou à CHANGEME dans Vault.
# Valeurs : kubernetes-cluster/<org>/<env>/<path> — catalogue et procédure de
# saisie : docs/vault-nouveau-cluster.md.
{{- $prefix := include "platform-secrets.prefix" . }}
{{- $common := dict "refreshInterval" .Values.refreshInterval }}

# --- minio --------------------------------------------------------------------
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-credentials
  namespace: devver-minio
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "platform-secrets.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $common.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform
  target:
    name: minio-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        annotations:
          {{- include "platform-secrets.vaultCheck" . | nindent 10 }}
  data:
    - secretKey: MINIO_ROOT_USER
      remoteRef:
        key: {{ $prefix }}/minio
        property: root_user
    - secretKey: MINIO_ROOT_PASSWORD
      remoteRef:
        key: {{ $prefix }}/minio
        property: root_password

