# ServiceAccounts présentés à Vault (auth k8s-<org>-<env>) par les
# ClusterSecretStores — liés aux roles eso-platform / eso-ghcr côté Vault.
{{- range list "eso-platform" "eso-ghcr" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ . }}
  namespace: {{ $.Values.esoNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    {{- include "platform-secrets.labels" $ | nindent 4 }}
{{- end }}
