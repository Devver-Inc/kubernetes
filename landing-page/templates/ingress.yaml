apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: landing-page-ingress
  namespace: devver-landing-page
  annotations:
    {{- with .Values.dnsTarget }}
    external-dns.alpha.kubernetes.io/target: {{ . }}
    {{- end }}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
spec:
  ingressClassName: traefik
  rules:
  - host: {{ .Values.domain }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: landing-page-svc
            port:
              number: 80
  
  - host: www.{{ .Values.domain }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: landing-page-svc
            port:
              number: 80

  tls:
  - hosts:
      - {{ .Values.domain }}
      - www.{{ .Values.domain }}
    secretName: landing-page-tls