{{- if .Values.secretEnv.vaultKey }}
{{- $name := include "service-template.name" . }}
# Lit clients/<namespace>/<vaultKey> par le SecretStore « vault » du namespace,
# créé par le chart du projet (helm-chart-deployment-template) : SA vault-reader,
# seul nom accepté par le role Vault eso-tenant avec vault-reader-mongo.
# Un SA propre à chaque service serait refusé par Vault.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-env
  namespace: {{ include "service-template.namespace" . }}
  labels:
    {{- include "service-template.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secretEnv.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: {{ .Values.secretEnv.secretStore }}
  target:
    name: {{ $name }}-env
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      metadata:
        annotations:
          {{- include "service-template.vaultCheck" . | nindent 10 }}
  dataFrom:
    - extract:
        key: {{ include "service-template.vaultPath" . }}/{{ .Values.secretEnv.vaultKey }}
{{- end }}
