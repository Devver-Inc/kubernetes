{{- if .Values.secretEnv.vaultKey }}
{{- $name := include "service-template.name" . }}
# SA / SecretStore propres à chaque service (une Application Argo par service) :
# même role Vault eso-tenant, limité à clients/<ce namespace>/*.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-reader-{{ $name }}
  namespace: {{ include "service-template.namespace" . }}
  labels:
    {{- include "service-template.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-{{ $name }}
  namespace: {{ include "service-template.namespace" . }}
  labels:
    {{- include "service-template.labels" . | nindent 4 }}
spec:
  provider:
    vault:
      server: {{ .Values.secrets.vault.server | quote }}
      path: {{ .Values.secrets.vault.mount | quote }}
      version: v2
      auth:
        kubernetes:
          mountPath: {{ include "service-template.vaultAuthMount" . | quote }}
          role: {{ .Values.secrets.vault.role | quote }}
          serviceAccountRef:
            name: vault-reader-{{ $name }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-env
  namespace: {{ include "service-template.namespace" . }}
  labels:
    {{- include "service-template.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secretEnv.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: vault-{{ $name }}
  target:
    name: {{ $name }}-env
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      metadata:
        annotations:
          {{- include "service-template.vaultCheck" . | nindent 10 }}
  dataFrom:
    - extract:
        key: {{ include "service-template.vaultPath" . }}/{{ .Values.secretEnv.vaultKey }}
{{- end }}
