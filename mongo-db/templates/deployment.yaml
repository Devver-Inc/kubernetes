apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: devver-mongodb
  annotations:
    kanister.kasten.io/blueprint: "mongodb-dep-blueprint"
    kanister.kasten.io/profile: "kanister-profile-nfs-devver-backup"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      # Le NAS n'applique que les droits du PROPRIÉTAIRE (pas "other", même en
      # 777) : sur un volume neuf, créé par root, l'utilisateur de l'image ne
      # pourrait pas écrire. On lui attribue d'abord son dossier de données
      # (root est autorisé : pas de squash). Non récursif ; sans effet sur un
      # volume existant déjà au bon propriétaire (prod).
      initContainers:
      - name: volume-ownership
        image: busybox:1.36
        command: ["sh", "-c", "chown 999:999 /data/db"]
        volumeMounts:
        - name: mongodb-storage
          mountPath: /data/db
      containers:
      - name: mongodb
        image: mongo:7.0
        ports:
        - containerPort: 27017
          name: mongodb
        env:
        - name: MONGO_INITDB_DATABASE
          value: "devver"
        volumeMounts:
        - name: mongodb-storage
          mountPath: /data/db
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
      volumes:
      - name: mongodb-storage
        persistentVolumeClaim:
          claimName: mongodb-pvc-nfs
