apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: devver-mongodb
  annotations:
    kanister.kasten.io/blueprint: "mongodb-dep-blueprint"
    kanister.kasten.io/profile: "kanister-profile-nfs-devver-backup"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      # Le NAS n'accorde à un utilisateur non-root que les dossiers dont il est
      # PROPRIÉTAIRE (pas "other", même en 777), et la racine du volume doit
      # rester à root (sinon même son nouveau propriétaire ne peut plus y
      # accéder — constaté sur vr27-dev). On crée donc un SOUS-DOSSIER de
      # données (storage.subPath) attribué à l'utilisateur de l'image (root est autorisé : pas de
      # squash). Non récursif ; sans effet si le dossier existe déjà.
      {{- with .Values.storage.subPath }}
      initContainers:
      - name: volume-ownership
        image: busybox:1.36
        command: ["sh", "-c", "mkdir -p /volume/{{ . }} && chown 999:999 /volume/{{ . }}"]
        volumeMounts:
        - name: mongodb-storage
          mountPath: /volume
      {{- end }}
      containers:
      - name: mongodb
        image: mongo:7.0
        ports:
        - containerPort: 27017
          name: mongodb
        env:
        - name: MONGO_INITDB_DATABASE
          value: "devver"
        volumeMounts:
        - name: mongodb-storage
          mountPath: /data/db
          {{- with .Values.storage.subPath }}
          subPath: {{ . }}
          {{- end }}
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
      volumes:
      - name: mongodb-storage
        persistentVolumeClaim:
          claimName: mongodb-pvc-nfs
