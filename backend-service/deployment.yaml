apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-service
  namespace: devver-backend-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-service
  template:
    metadata:
      labels:
        app: backend-service
    spec:
      # SA présenté à Vault (auth Kubernetes, rôle backend) — voir serviceaccount.yaml
      serviceAccountName: backend-service
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: backend
        image: ghcr.io/devver-inc/backend-service:latest
        command: ["node", "dist/main.js"]
        ports:
        - containerPort: 3000
          name: http
        envFrom:
        - configMapRef:
            name: backend-config
        - secretRef:
            name: backend-secret
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
