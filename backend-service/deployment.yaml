apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-service
  namespace: devver-backend-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-service
  template:
    metadata:
      labels:
        app: backend-service
    spec:
      serviceAccountName: backend-service
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: backend
        image: ghcr.io/devver-inc/backend-service:latest
        command: ["node", "dist/main.js"]
        ports:
        - containerPort: 3000
          name: http
        envFrom:
        - secretRef:
            name: backend-secret
        env:
        - name: BACKEND_INTERNAL_URL
          value: "http://backend-service.devver-backend-service.svc.cluster.local:3000/api/v1"
        - name: GIT_SSH_HOST
          value: "git.devver.app"
        - name: VAULT_ADDR
          value: "https://vault.devver.app"
        - name: VAULT_KV_MOUNT
          value: "devver_K8s"
        - name: VAULT_AUTH_MOUNT
          value: "devver_k8s_prod"
        - name: VAULT_ROLE
          value: "backend-service"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
