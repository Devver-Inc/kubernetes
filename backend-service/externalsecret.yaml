# Clés attendues : voir backend-service/.env.example. DEPLOY_AGENT_SECRET >= 32 caractères.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-service
  namespace: devver-backend-service
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault
  namespace: devver-backend-service
spec:
  provider:
    vault:
      server: "https://vault.devver.app"
      path: "devver_K8s"
      version: v2
      auth:
        kubernetes:
          mountPath: "devver_k8s_prod"
          role: "backend-service"
          serviceAccountRef:
            name: backend-service
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backend-secret
  namespace: devver-backend-service
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: backend-secret
  dataFrom:
    - extract:
        key: backend
