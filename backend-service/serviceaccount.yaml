# Identité du backend auprès de Vault : auth Kubernetes k8s-<org>-<env>, rôle
# "backend" (lié à ce SA et à ce namespace, terraform/vault/k8s-secrets.tf de
# cluster-k8s-deployment). Le backend présente le jeton de ce SA monté par le
# kubelet (/var/run/secrets/kubernetes.io/serviceaccount/token, court et
# renouvelé automatiquement) : aucun secret Vault statique à stocker.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-service
  namespace: devver-backend-service
