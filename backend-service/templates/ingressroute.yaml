apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-service-ingress
  namespace: devver-backend-service
  annotations:
    {{- with .Values.dnsTarget }}
    external-dns.alpha.kubernetes.io/target: {{ . }}
    {{- end }}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
spec:
  ingressClassName: traefik
  rules:
    - host: app.{{ .Values.domain }}
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 3000
  tls:
    - hosts:
        - app.{{ .Values.domain }}
      secretName: backend-service-tls
---
# Routes appelées uniquement depuis le cluster (deploy-agents, git-gateway) : fermées en public.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: deny-public
  namespace: devver-backend-service
spec:
  ipAllowList:
    sourceRange:
      - 127.0.0.1/32
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-service-internal-closed
  namespace: devver-backend-service
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: devver-backend-service-deny-public@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: app.{{ .Values.domain }}
      http:
        paths:
          - path: /api/v1/internal
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 3000
          - path: /api/v1/git-gateway
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 3000
  tls:
    - hosts:
        - app.{{ .Values.domain }}
      secretName: backend-service-tls
