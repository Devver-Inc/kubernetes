{{- if .Values.vault.enabled }}
# Secret du backend depuis Vault (ESO, ClusterSecretStore vault-platform de
# platform-secrets). Porté par CE chart, et non par platform-secrets : tant que
# le backend n'est pas configuré (clés LOGTO_* / ARGOCD_API_KEY à CHANGEME),
# seule l'Application backend-service est en erreur — pas les secrets de toute
# la stack.
# backend/* (ENCRYPTION_KEY, DEPLOY_AGENT_SECRET, GIT_TOKEN_SECRET, LOGTO_*,
# ARGOCD_API_KEY, VAULT_*) + identifiants MinIO + token GitHub.
{{- $prefix := required "vault.prefix est requis (<org>/<env>)" .Values.vault.prefix }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-secret
  namespace: devver-backend-service
spec:
  refreshInterval: {{ .Values.vault.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform
  target:
    name: backend-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        annotations:
          # Garde-fou : pas de Secret (donc pas de pod) si une valeur est vide ou CHANGEME.
          devver.app/vault-check: {{ `{{ range $k, $v := . }}{{ if or (eq (trim $v) "") (eq (upper (trim $v)) "CHANGEME") }}{{ fail (printf "cle %s vide ou CHANGEME dans Vault : a saisir dans la console" $k) }}{{ end }}{{ end }}ok` | squote }}
  dataFrom:
    - extract:
        key: {{ $prefix }}/backend
  data:
    - secretKey: STORAGE_ACCESS_KEY
      remoteRef:
        key: {{ $prefix }}/minio
        property: root_user
    - secretKey: STORAGE_SECRET_KEY
      remoteRef:
        key: {{ $prefix }}/minio
        property: root_password
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: {{ $prefix }}/github
        property: token
{{- end }}
