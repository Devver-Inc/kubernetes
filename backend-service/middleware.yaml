apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: backend-strip-prefix
  namespace: devver-backend-service
spec:
  stripPrefix:
    prefixes:
      - /api
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: deny-public
  namespace: devver-backend-service
spec:
  ipAllowList:
    sourceRange:
      - 127.0.0.1/32
