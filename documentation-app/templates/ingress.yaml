apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: documentation-app-ingress
  namespace: devver-documentation-app
  annotations:
    {{- with .Values.dnsTarget }}
    external-dns.alpha.kubernetes.io/target: {{ . }}
    {{- end }}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
spec:
  ingressClassName: traefik
  rules:
    - host: docs.{{ .Values.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: documentation-app-svc
                port:
                  number: 80
  tls:
    - hosts:
        - docs.{{ .Values.domain }}
      secretName: documentation-app-tls
