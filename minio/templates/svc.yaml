apiVersion: v1
kind: Service
metadata:
  name: minio-api-svc
  namespace: devver-minio
spec:
  selector:
    app: minio
  ports:
    - protocol: TCP
      port: 9000
      targetPort: 9000
      name: api
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: minio-console-svc
  namespace: devver-minio
spec:
  selector:
    app: minio
  ports:
    - protocol: TCP
      port: 9001
      targetPort: 9001
      name: console
  type: ClusterIP
