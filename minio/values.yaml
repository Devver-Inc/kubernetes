# Valeurs par défaut = cluster de prod actuel (devver.app, appliqué à la main).
# Les nouveaux clusters reçoivent les leurs de leur Application ArgoCD
# (argocd/templates/applications/).

# Domaine du cluster : les hôtes sont <sous-domaine>.<domain>.
domain: devver.app

# Cible external-dns (CNAME) des Ingress ; vide = pas d'annotation (nouveaux
# clusters, en attendant le Traefik frontal / DNS Cloudflare).
dnsTarget: reverse-proxy.vrhometech.fr

# false sur les nouveaux clusters : namespaces créés par platform-secrets.
namespace:
  create: true

storageClass: nfs-devver-prod

# minio/minio n'est plus publié sur Docker Hub (fin des images communautaires
# MinIO) : la prod tourne sur l'image en cache de ses noeuds. Les nouveaux
# clusters utilisent pgsty/minio (build communautaire maintenu, même
# entrypoint), version figée par l'Application ArgoCD.
image:
  repository: minio/minio
  tag: latest
